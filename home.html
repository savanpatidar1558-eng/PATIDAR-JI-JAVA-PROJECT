<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maa Ambika HRMIS - Premium</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* 🏥 प्रीमियम हॉस्पिटल / मेडिकल थीम (Blue & Aqua) */
    body { 
      margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; color: white; height: 100vh; display: flex; flex-direction: column; 
      background: linear-gradient(-45deg, #0575E6, #021B79, #00C9FF, #92FE9D); 
      background-size: 400% 400%; animation: gradientBG 15s ease infinite; 
      overflow: hidden; position: relative;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    /* बैकग्राउंड में तैरते हुए शेप्स */
    .bg-animation { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
    .shape { position: absolute; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(2px); border: 1px solid rgba(255, 255, 255, 0.1); animation: floatUp infinite linear; }
    .shape.circle { border-radius: 50%; } 
    .s1 { width: 150px; height: 150px; left: 5%; bottom: -150px; animation-duration: 18s; } 
    .s2 { width: 100px; height: 100px; left: 80%; bottom: -100px; animation-duration: 12s; animation-delay: 2s; }
    .s3 { width: 60px; height: 60px; left: 40%; bottom: -80px; animation-duration: 15s; animation-delay: 5s; }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; } }

    /* नोटिस बार */
    .notice-bar { width: 100%; background: rgba(255, 255, 255, 0.95); display: none; align-items: center; padding: 10px 15px; box-sizing: border-box; border-bottom: 3px solid #f39c12; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 20; position: relative; overflow: hidden;}
    .notice-badge { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; margin-right: 15px; box-shadow: 0 2px 5px rgba(231, 76, 60, 0.5); animation: pulse 1.5s infinite; z-index: 2; flex-shrink: 0; text-transform: uppercase;}
    .ticker-wrap { flex-grow: 1; overflow: hidden; white-space: nowrap; position: relative; }
    .ticker-text { display: inline-block; white-space: nowrap; color: #d35400; font-weight: bold; font-size: 16px; padding-left: 100%; animation: ticker 25s linear infinite; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* टॉप नेविगेशन बटन */
    .top-nav { display: flex; justify-content: space-between; padding: 20px 15px; z-index: 10; position: relative; gap: 15px;}
    .nav-btn { flex: 1; padding: 15px 5px; font-size: 16px; font-weight: 800; color: white; border: none; border-radius: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;}
    .btn-staff { background: linear-gradient(135deg, #00b09b, #96c93d); } 
    .btn-director { background: linear-gradient(135deg, #FF416C, #FF4B2B); } 
    .nav-btn:active { transform: scale(0.92); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

    /* मेन ग्लास बॉक्स (Center Content) */
    .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 10; position: relative;}
    .main-content { 
      background: rgba(255, 255, 255, 0.12); /* Glass effect */
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 25px; padding: 40px 25px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.2); 
      width: 95%; max-width: 450px; 
      animation: zoomIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    @keyframes zoomIn { 0% { opacity: 0; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1); } }

    .greeting { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #00ffcc; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); background: rgba(0,0,0,0.3); display: inline-block; padding: 8px 20px; border-radius: 30px; letter-spacing: 1px;}
    .title { font-size: 34px; font-weight: 900; margin: 0; letter-spacing: 1px; line-height: 1.3; text-shadow: 3px 3px 10px rgba(0,0,0,0.5);}
    .subtitle { font-size: 15px; margin-top: 15px; font-weight: 800; letter-spacing: 3px; color: #ffffff; background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 12px; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
    
    /* स्टार स्टाफ बॉक्स */
    .star-box { margin-top: 30px; background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%); border: 3px solid #fff; padding: 20px; border-radius: 20px; display: none; text-align: center; box-shadow: 0 15px 30px rgba(243, 156, 18, 0.5); animation: popUp 1s ease;}
    @keyframes popUp { 0% { transform: scale(0); } 80% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .star-title { font-size: 15px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); margin-bottom: 5px; text-transform: uppercase;}
    .star-name { font-size: 26px; font-weight: 900; color: #1e3c72; text-transform: uppercase;}
    .star-icon { font-size: 35px; margin-bottom: -5px;}

    /* सैलरी अलर्ट बॉक्स */
    .paid-staff-box { margin-top: 20px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(241, 196, 15, 0.6); padding: 15px; border-radius: 15px; display: none; text-align: center; backdrop-filter: blur(5px);}
    .paid-staff-title { font-size: 14px; color: #00ffcc; margin-bottom: 8px; font-weight: bold;} 
    .paid-staff-names { font-size: 18px; font-weight: bold; color: #fff;}

    /* पिन मोडल (Director Login) */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter: blur(15px); display:none; justify-content:center; align-items:center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
    .modal-box { background: white; padding:35px 25px; border-radius:30px; text-align:center; color:#2c3e50; width:85%; max-width:350px; transform: scale(0.8); transition: transform 0.3s; box-sizing:border-box; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 5px solid #f1c40f;}
    .modal-overlay.show { opacity: 1; } .modal-overlay.show .modal-box { transform: scale(1); }
    
    .pin-input { width:100%; padding:15px; font-size:28px; text-align:center; letter-spacing:15px; text-indent:15px; margin-bottom:25px; border: 3px solid #bdc3c7; border-radius: 15px; font-weight: 900; background: #f8f9fa; color: #2c3e50; outline: none; box-sizing:border-box; transition: 0.3s;}
    .pin-input:focus { border-color: #3498db; box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);}
    .modal-btn { width:100%; padding:15px; font-size:18px; border:none; border-radius:15px; cursor:pointer; font-weight:bold; margin-bottom:15px; color: white; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;}
    .modal-btn:active { transform: scale(0.95); }
    .btn-unlock { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4);} 
    .btn-close { background: #e74c3c; box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);}
  </style>
</head>
<body>

  <div class="bg-animation"><div class="shape circle s1"></div><div class="shape circle s2"></div><div class="shape circle s3"></div></div>

  <div class="notice-bar" id="homeNoticeBoard">
    <div class="notice-badge">📢 सूचना</div>
    <div class="ticker-wrap"><div class="ticker-text" id="noticeMarquee">लोड हो रहा है...</div></div>
  </div>

  <div class="top-nav">
    <button class="nav-btn btn-staff" onclick="goToPage('staff')">👨‍⚕️ Staff Login</button>
    <button class="nav-btn btn-director" onclick="openPinModal()">⚙️ Director Login</button>
  </div>

  <div class="main-wrapper">
    <div class="main-content">
      <div class="greeting" id="greetingText">लोड हो रहा है...</div>
      <h1 class="title">माँ अंबिका<br>डायग्नोस्टिक सेंटर<br><span style="font-size:26px; color:#f1c40f; text-shadow: 2px 2px 5px rgba(0,0,0,0.6);">सनावद</span></h1>
      <div class="subtitle">HRMIS PRO SOFTWARE</div>
      
      <div class="star-box" id="starStaffBox">
        <div class="star-icon">🏆</div>
        <div class="star-title">एम्प्लॉई ऑफ द मंथ <span id="starMonthName"></span></div>
        <div class="star-name" id="starStaffName">...</div>
      </div>

      <div class="paid-staff-box" id="paidStaffBox"><div class="paid-staff-title">💸 इस महीने की सैलरी इन्हें मिल चुकी है:</div><div class="paid-staff-names" id="paidStaffNames">...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="pinModal">
    <div class="modal-box">
      <h2 style="margin-top:0; color:#1e3c72; font-size: 26px; font-weight: 900;">🔒 Admin Login</h2>
      <p style="color:#7f8c8d; font-size: 14px; margin-bottom: 25px; font-weight: bold;">अपना 4-अंकों का सिक्योरिटी पिन दर्ज़ करें</p>
      <input type="password" id="adminPin" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
      <button class="modal-btn btn-unlock" id="btnUnlock" onclick="verifyPin()">🔓 UNLOCK</button>
      <button class="modal-btn btn-close" onclick="closePinModal()">❌ Cancel</button>
    </div>
  </div>

  <script>
    // 🎇 1. लगातार चलने वाले पटाखे (सुपर हैवी मात्रा में)
    function startContinuousConfetti() {
        var colors = ['#00ffcc', '#f1c40f', '#e74c3c', '#ffffff', '#3498db']; // थीम के हिसाब से कलर्स
        setInterval(function() {
            // बायीं तरफ से हैवी फ़ायरवर्क्स
            confetti({
                particleCount: 12, // मात्रा बढ़ा दी
                angle: 60,
                spread: 70, // फैलाव बढ़ा दिया
                startVelocity: 45, // ऊंचाई बढ़ा दी
                origin: { x: -0.1, y: 0.7 },
                colors: colors,
                zIndex: 5
            });
            // दायीं तरफ से हैवी फ़ायरवर्क्स
            confetti({
                particleCount: 12, 
                angle: 120,
                spread: 70,
                startVelocity: 45, 
                origin: { x: 1.1, y: 0.7 },
                colors: colors,
                zIndex: 5
            });
        }, 250); // स्पीड बढ़ा दी (हर 0.25 सेकंड)
    }
    // पेज लोड होते ही चालू कर दो
    startContinuousConfetti();

    function setGreeting() {
      let hour = new Date().getHours();
      let greeting = (hour >= 5 && hour < 12) ? "🌅 शुभ प्रभात (Good Morning)" : (hour >= 12 && hour < 17) ? "☀️ शुभ दोपहर (Good Afternoon)" : (hour >= 17 && hour < 21) ? "🌙 शुभ संध्या (Good Evening)" : "🌌 शुभ रात्रि (Good Night)";
      document.getElementById('greetingText').innerText = greeting;
    }
    setGreeting(); setInterval(setGreeting, 60000);

    google.script.run.withSuccessHandler(function(notice) {
       google.script.run.withSuccessHandler(function(bdays) {
           var finalNotice = "";
           if(bdays && bdays.length > 0) { finalNotice += " 🎂 माँ अंबिका परिवार की ओर से " + bdays.join(", ") + " को जन्मदिन की ढेरों बधाइयाँ! 🎉  |  "; }
           if(notice && notice.trim() !== "") { finalNotice += notice; }
           if(finalNotice !== "") {
               document.getElementById('homeNoticeBoard').style.display = "flex";
               document.getElementById('noticeMarquee').innerText = finalNotice;
           }
       }).getTodayBirthdays();
    }).getNotice();

    google.script.run.withSuccessHandler(function(data) {
       if(data && data.name) {
           document.getElementById('starStaffBox').style.display = "block";
           document.getElementById('starStaffName').innerText = data.name;
           document.getElementById('starMonthName').innerText = "(" + data.monthName + ")";
       }
    }).getEmployeeOfTheMonth();

    google.script.run.withSuccessHandler(function(data) {
       if(data.names && data.names.length > 0) {
           document.getElementById('paidStaffBox').style.display = "block"; document.getElementById('paidStaffNames').innerText = data.names.join(", ");
       }
    }).getRecentPaidStaff();

    var appUrl = ""; google.script.run.withSuccessHandler(function(url) { appUrl = url; }).getScriptUrl();
    function goToPage(pageName) { if(appUrl) { document.body.style.opacity = "0.2"; window.top.location.href = appUrl + "?page=" + pageName; } }
    
    function openPinModal() { var modal = document.getElementById('pinModal'); modal.style.display = 'flex'; setTimeout(() => modal.classList.add('show'), 10); document.getElementById('adminPin').value = ""; document.getElementById('adminPin').focus(); }
    function closePinModal() { var modal = document.getElementById('pinModal'); modal.classList.remove('show'); setTimeout(() => modal.style.display = 'none', 300); }

    // 🎇 2. कान्हा कुंज स्टाइल - पिन डालने पर सुपर धमाका
    function verifyPin() {
      var pinInput = document.getElementById('adminPin'); var unlockBtn = document.getElementById('btnUnlock');
      if(pinInput.value === "1234") { 
          unlockBtn.innerText = "✅ SUCCESS!"; unlockBtn.style.background = "#27ae60"; pinInput.style.borderColor = "#27ae60"; pinInput.style.color = "#27ae60";
          
          // पूरी स्क्रीन पर वन-टाइम बहुत बड़ा धमाका
          var duration = 1500;
          var animationEnd = Date.now() + duration;
          var defaults = { startVelocity: 60, spread: 360, ticks: 100, zIndex: 2000 };
          function randomInRange(min, max) { return Math.random() * (max - min) + min; }
          var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 150 * (timeLeft / duration); // पार्टिकल्स बढ़ा दिए
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
          }, 200);

          setTimeout(() => { goToPage('director'); }, 1500); 
      } else { 
          pinInput.style.borderColor = "#e74c3c"; pinInput.style.color = "#e74c3c";
          setTimeout(() => { pinInput.value = ""; pinInput.style.borderColor = "#bdc3c7"; pinInput.style.color = "#2c3e50"; }, 800); alert("❌ गलत पिन!"); 
      }
    }
  </script>
</body>
</html>
